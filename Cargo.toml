[workspace]
resolver = "3"
members = [
    "crates/kalfa-evren",
    "crates/kalfa-core",
    "crates/kalfa-tools",
    "crates/kalfa-uygulama",
    "crates/kalfa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Orkun Koray Güngör"]

[workspace.dependencies]
async-trait = "0.1.92"
bytes = "1.12"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
futures-util = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
ignore = "0.4.33"
keyring = "4.2"
jsonschema = { version = "0.56", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "charset", "system-proxy"] }
rust_decimal = { version = "1.43", features = ["serde"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
regex = "1.13"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
similar = "3.2"
tempfile = "3.27"
thiserror = "2.0.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
url = "2.5"
uuid = { version = "1.26", features = ["v4", "serde"] }
wiremock = "0.6.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
