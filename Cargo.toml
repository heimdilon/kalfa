[workspace]
resolver = "3"
members = [
    "crates/kalfa-evren",
    "crates/kalfa-mcp",
    "crates/kalfa-core",
    "crates/kalfa-sandbox",
    "crates/kalfa-tools",
    "crates/kalfa-uygulama",
    "crates/kalfa",
    "crates/kalfa-yalitim",
    "crates/kalfa-plugin-sdk",
    "crates/kalfa-plugin",
    "crates/kalfa-rag",
    "crates/kalfa-plugin/test-eklentileri/kalfa-test-eklentisi",
    "crates/kalfa-plugin/test-eklentileri/kalfa-test-soket",
    "crates/kalfa-plugin/test-eklentileri/kalfa-test-yanlis-dunya",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Orkun Koray Güngör"]

# Geliştirme ve test derlemelerinde yalnızca satır tabloları: geri izlemeler dosya
# ve satırı gösterir, target klasörü küçülür. Hata ayıklayıcı için tam bilgi
# gerekirse: CARGO_PROFILE_DEV_DEBUG=true
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
async-trait = "0.1.92"
rmcp = { version = "=3.5.1", default-features = false, features = ["client"] }
tracing = "0.1.44"
base64 = "0.22"
bytes = "1.12"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
futures-util = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
ignore = "0.4.33"
keyring = "4.2"
libc = "0.2.189"
jsonschema = { version = "0.56", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "charset", "system-proxy"] }
rust_decimal = { version = "1.43", features = ["serde"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
regex = "1.13"
same-file = "1.0.6"
semver = "1.0.28"
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
similar = "3.2"
tempfile = "3.27"
thiserror = "2.0.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
toml = "1.1"
url = "2.5"
# Eklenti çalışma zamanı (aşama 4 tasarımı §5.2). Tam sürümle sabit: bileşen
# API'si sürümler arasında değişiyor; yükseltme ayrı bir iştir.
wasmtime = { version = "=49.0.3", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "std"] }
wasmtime-wasi = { version = "=49.0.3", default-features = false, features = ["p2"] }
wit-bindgen = "0.62"
uuid = { version = "1.26", features = ["v4", "serde"] }
wiremock = "0.6.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
