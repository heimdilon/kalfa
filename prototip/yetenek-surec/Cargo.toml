# Yetenek Programı Hat 03 (G2a): Süreç sahipliği, kilit ve yalıtım içi
# borulu / PTY / ConPTY deney kapısı. Ürün kodu değildir; Kalfa'nın
# workspace'ine girmez. Sonuçlar:
# docs/superpowers/bulgular/yetenek-programi/surec-deneyi.md
[package]
name = "kalfa-yetenek-surec-prototip"
version = "0.0.0"
edition = "2024"
publish = false

# Kalfa'nın workspace'inden bağımsız.
[workspace]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
