[package]
name = "kalfa-g6-olcum"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Orkun Koray Güngör"]
publish = false

# Ürün workspace'ine girmez; yalnızca mevcut SDK ve bağımlılıklarını ölçer.
[workspace]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "g6-yerel"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
serde_json = "=1.0.151"
kalfa-plugin-sdk = { path = "../../crates/kalfa-plugin-sdk" }
