<!-- @dsCard group="Surfaces" viewport="700x170" name="Surface ladder" subtitle="Depth comes from value, not shadow: rail → app → sunken → card → raised." -->
<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-body);font:var(--type-body);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;height:74px}
.n{font:var(--type-meta);font-size:10px;color:inherit;opacity:.85}.h{font:var(--fw-semibold) 11px/1 var(--font-mono);letter-spacing:.02em}
.k{font:var(--type-meta);color:var(--text-muted)}.t{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
table{border-collapse:collapse;width:100%}td{padding:4px 10px 4px 0;vertical-align:baseline}</style></head><body class="kalfa-root"><div class="row">
<div class="sw" style="background:var(--bg-rail);color:var(--text-secondary);height:88px"><span class="h" style="color:var(--text-body)">rail</span><span class="n">--bg-rail</span></div><div class="sw" style="background:var(--bg-app);color:var(--text-secondary);height:88px"><span class="h" style="color:var(--text-body)">app</span><span class="n">--bg-app</span></div><div class="sw" style="background:var(--surface-sunken);color:var(--text-secondary);height:88px"><span class="h" style="color:var(--text-body)">sunken</span><span class="n">--surface-sunken</span></div><div class="sw" style="background:var(--surface-card);color:var(--text-secondary);height:88px"><span class="h" style="color:var(--text-body)">card</span><span class="n">--surface-card</span></div><div class="sw" style="background:var(--surface-raised);color:var(--text-secondary);height:88px"><span class="h" style="color:var(--text-body)">raised</span><span class="n">--surface-raised</span></div><div class="sw" style="background:var(--surface-selected);color:var(--text-secondary);height:88px"><span class="h" style="color:var(--text-body)">selected</span><span class="n">--surface-selected</span></div><div class="sw" style="background:var(--surface-selected-strong);color:var(--text-secondary);height:88px"><span class="h" style="color:var(--text-body)">selected +</span><span class="n">--surface-selected-strong</span></div>
</div></body></html>
