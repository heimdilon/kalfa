<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-body);font:var(--type-body);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;height:74px}
.n{font:var(--type-meta);font-size:10px;color:inherit;opacity:.85}.h{font:var(--fw-semibold) 11px/1 var(--font-mono);letter-spacing:.02em}
.k{font:var(--type-meta);color:var(--text-muted)}.t{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
table{border-collapse:collapse;width:100%}td{padding:4px 10px 4px 0;vertical-align:baseline}</style></head><body class="kalfa-root"><div class="row">
<div class="sw" style="background:var(--copper-100);color:#2b1e15"><span class="h">copper-100</span><span class="n">--copper-100</span></div><div class="sw" style="background:var(--copper-200);color:#2b1e15"><span class="h">copper-200</span><span class="n">--copper-200</span></div><div class="sw" style="background:var(--copper-300);color:#2b1e15"><span class="h">copper-300</span><span class="n">--copper-300</span></div><div class="sw" style="background:var(--copper-400);color:#1a1613"><span class="h">copper-400</span><span class="n">--copper-400</span></div><div class="sw" style="background:var(--copper-500);color:#fcfaf6"><span class="h">copper-500</span><span class="n">--copper-500</span></div><div class="sw" style="background:var(--copper-600);color:#fcfaf6"><span class="h">copper-600</span><span class="n">--copper-600</span></div><div class="sw" style="background:var(--copper-tint);color:#f3ab78"><span class="h">tint</span><span class="n">--copper-tint</span></div><div class="sw" style="background:var(--copper-tint-strong);color:#f3ab78"><span class="h">tint-strong</span><span class="n">--copper-tint-strong</span></div>
</div></body></html>
