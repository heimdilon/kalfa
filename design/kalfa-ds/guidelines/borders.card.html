<!-- @dsCard group="Surfaces" viewport="700x170" name="Hairlines & edges" subtitle="1px hairline everywhere; 1.5px copper for live or selected." -->
<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-body);font:var(--type-body);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;height:74px}
.n{font:var(--type-meta);font-size:10px;color:inherit;opacity:.85}.h{font:var(--fw-semibold) 11px/1 var(--font-mono);letter-spacing:.02em}
.k{font:var(--type-meta);color:var(--text-muted)}.t{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
table{border-collapse:collapse;width:100%}td{padding:4px 10px 4px 0;vertical-align:baseline}</style></head><body class="kalfa-root"><div class="row" style="gap:14px">
<div style="flex:1;height:96px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:10px"><div class="k">--border-subtle</div><div style="font:var(--type-small);margin-top:6px">panel · card</div></div>
<div style="flex:1;height:96px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:10px"><div class="k">--border-default</div><div style="font:var(--type-small);margin-top:6px">control</div></div>
<div style="flex:1;height:96px;background:var(--surface-card);border:1.5px solid var(--border-accent);border-radius:var(--radius-xl);padding:10px"><div class="k" style="color:var(--text-accent)">--border-accent 1.5px</div><div style="font:var(--type-small);margin-top:6px">composer · awaiting you</div></div>
<div style="flex:1;height:96px;background:var(--surface-selected);box-shadow:var(--shadow-accent-edge);border-radius:var(--radius-md);padding:10px"><div class="k" style="color:var(--text-accent)">--shadow-accent-edge</div><div style="font:var(--type-small);margin-top:6px">selected row</div></div>
</div></body></html>
