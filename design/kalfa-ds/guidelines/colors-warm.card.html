<!-- @dsCard group="Colors" viewport="700x150" name="Warm charcoal — dark neutrals" subtitle="App, rail, card, border, text. Dark is the product default." -->
<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-body);font:var(--type-body);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;height:74px}
.n{font:var(--type-meta);font-size:10px;color:inherit;opacity:.85}.h{font:var(--fw-semibold) 11px/1 var(--font-mono);letter-spacing:.02em}
.k{font:var(--type-meta);color:var(--text-muted)}.t{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
table{border-collapse:collapse;width:100%}td{padding:4px 10px 4px 0;vertical-align:baseline}</style></head><body class="kalfa-root"><div class="row">
<div class="sw" style="background:var(--warm-1000);color:#a6adb2"><span class="h">1000</span><span class="n">--warm-1000</span></div><div class="sw" style="background:var(--warm-900);color:#a6adb2"><span class="h">900</span><span class="n">--warm-900</span></div><div class="sw" style="background:var(--warm-850);color:#a6adb2"><span class="h">850</span><span class="n">--warm-850</span></div><div class="sw" style="background:var(--warm-750);color:#a6adb2"><span class="h">750</span><span class="n">--warm-750</span></div><div class="sw" style="background:var(--warm-650);color:#c9cdd0"><span class="h">650</span><span class="n">--warm-650</span></div><div class="sw" style="background:var(--warm-500);color:#e8e6e3"><span class="h">500</span><span class="n">--warm-500</span></div><div class="sw" style="background:var(--warm-300);color:#111619"><span class="h">300</span><span class="n">--warm-300</span></div><div class="sw" style="background:var(--warm-100);color:#111619"><span class="h">100</span><span class="n">--warm-100</span></div><div class="sw" style="background:var(--warm-050);color:#111619"><span class="h">050</span><span class="n">--warm-050</span></div>
</div></body></html>
