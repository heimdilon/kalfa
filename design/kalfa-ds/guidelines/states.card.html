<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-body);font:var(--type-body);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;height:74px}
.n{font:var(--type-meta);font-size:10px;color:inherit;opacity:.85}.h{font:var(--fw-semibold) 11px/1 var(--font-mono);letter-spacing:.02em}
.k{font:var(--type-meta);color:var(--text-muted)}.t{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
table{border-collapse:collapse;width:100%}td{padding:4px 10px 4px 0;vertical-align:baseline}</style></head><body class="kalfa-root"><div class="row" style="gap:12px">
<div style="text-align:center"><div style="height:34px;padding:0 18px;display:inline-flex;align-items:center;background:var(--action-primary);color:var(--action-primary-fg);border-radius:var(--radius-md);font:var(--fw-medium) 13px/1 var(--font-sans);transform:none;box-shadow:none">Onayla</div><div class="k" style="margin-top:8px;font-size:10px">rest</div></div><div style="text-align:center"><div style="height:34px;padding:0 18px;display:inline-flex;align-items:center;background:var(--action-primary-hover);color:var(--action-primary-fg);border-radius:var(--radius-md);font:var(--fw-medium) 13px/1 var(--font-sans);transform:none;box-shadow:none">Onayla</div><div class="k" style="margin-top:8px;font-size:10px">hover</div></div><div style="text-align:center"><div style="height:34px;padding:0 18px;display:inline-flex;align-items:center;background:var(--action-primary-press);color:var(--action-primary-fg);border-radius:var(--radius-md);font:var(--fw-medium) 13px/1 var(--font-sans);transform:translateY(0.5px);box-shadow:none">Onayla</div><div class="k" style="margin-top:8px;font-size:10px">press</div></div><div style="text-align:center"><div style="height:34px;padding:0 18px;display:inline-flex;align-items:center;background:var(--action-primary);color:var(--action-primary-fg);border-radius:var(--radius-md);font:var(--fw-medium) 13px/1 var(--font-sans);transform:none;box-shadow:var(--shadow-focus)">Onayla</div><div class="k" style="margin-top:8px;font-size:10px">focus</div></div>
<div style="text-align:center"><div style="height:34px;padding:0 18px;display:inline-flex;align-items:center;background:transparent;color:var(--text-muted);border:1px solid var(--border-subtle);border-radius:var(--radius-md);font:var(--fw-medium) 13px/1 var(--font-sans);opacity:.55">Onayla</div><div class="k" style="margin-top:8px;font-size:10px">disabled</div></div>
</div></body></html>
