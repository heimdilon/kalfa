<!-- @dsCard group="Colors" viewport="700x150" name="Warm paper — light scope" subtitle="Onboarding, terms, documents. Applied via .kalfa-light." -->
<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-body);font:var(--type-body);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;height:74px}
.n{font:var(--type-meta);font-size:10px;color:inherit;opacity:.85}.h{font:var(--fw-semibold) 11px/1 var(--font-mono);letter-spacing:.02em}
.k{font:var(--type-meta);color:var(--text-muted)}.t{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
table{border-collapse:collapse;width:100%}td{padding:4px 10px 4px 0;vertical-align:baseline}</style></head><body class="kalfa-root"><div class="row">
<div class="sw" style="background:var(--paper-050);color:#23201d"><span class="h">050</span><span class="n">--paper-050</span></div><div class="sw" style="background:var(--paper-100);color:#23201d"><span class="h">100</span><span class="n">--paper-100</span></div><div class="sw" style="background:var(--paper-200);color:#23201d"><span class="h">200</span><span class="n">--paper-200</span></div><div class="sw" style="background:var(--paper-300);color:#23201d"><span class="h">300</span><span class="n">--paper-300</span></div><div class="sw" style="background:var(--paper-400);color:#23201d"><span class="h">400</span><span class="n">--paper-400</span></div><div class="sw" style="background:var(--paper-500);color:#23201d"><span class="h">500</span><span class="n">--paper-500</span></div><div class="sw" style="background:var(--paper-600);color:#fcfaf6"><span class="h">600</span><span class="n">--paper-600</span></div><div class="sw" style="background:var(--paper-700);color:#fcfaf6"><span class="h">700</span><span class="n">--paper-700</span></div><div class="sw" style="background:var(--paper-900);color:#fcfaf6"><span class="h">900</span><span class="n">--paper-900</span></div>
</div></body></html>
