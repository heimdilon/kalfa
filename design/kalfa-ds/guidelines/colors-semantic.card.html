<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Green ok · amber caution · red danger · blue info — and their tints." -->
<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--bg-app);color:var(--text-body);font:var(--type-body);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;height:74px}
.n{font:var(--type-meta);font-size:10px;color:inherit;opacity:.85}.h{font:var(--fw-semibold) 11px/1 var(--font-mono);letter-spacing:.02em}
.k{font:var(--type-meta);color:var(--text-muted)}.t{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
table{border-collapse:collapse;width:100%}td{padding:4px 10px 4px 0;vertical-align:baseline}</style></head><body class="kalfa-root"><div class="row">
<div class="sw" style="background:var(--green-200);color:#0f1214"><span class="h">ok</span><span class="n">--green-200</span></div><div class="sw" style="background:var(--green-tint);color:#5fcb9c"><span class="h">ok tint</span><span class="n">--green-tint</span></div><div class="sw" style="background:var(--amber-200);color:#0f1214"><span class="h">warn</span><span class="n">--amber-200</span></div><div class="sw" style="background:var(--amber-tint);color:#d9a05b"><span class="h">warn tint</span><span class="n">--amber-tint</span></div><div class="sw" style="background:var(--red-200);color:#0f1214"><span class="h">danger</span><span class="n">--red-200</span></div><div class="sw" style="background:var(--red-tint);color:#e0776e"><span class="h">danger tint</span><span class="n">--red-tint</span></div><div class="sw" style="background:var(--blue-200);color:#0f1214"><span class="h">info</span><span class="n">--blue-200</span></div><div class="sw" style="background:var(--blue-tint);color:#79a9c9"><span class="h">info tint</span><span class="n">--blue-tint</span></div>
</div></body></html>
