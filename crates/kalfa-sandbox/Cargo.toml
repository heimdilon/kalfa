[package]
name = "kalfa-sandbox"
description = "Kalfa'nın kabuk komutlarını çalıştırması: süreç sınırları, süreç ağacı, yalıtım arka uçları"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Gerçek yalıtımla koşan testler (aşama 2 tasarımı §12.2). Yalıtım yoksa
# atlanmaz, başarısız olur.
yalitim-testleri = []
# Uçtan uca testlerin sahte ad çözümü (`KALFA_E2E_SAHTE_DNS`). Yalnızca
# `kalfa-uygulama/e2e` açar; sürüm derlemesine girmez.
e2e = []

[dependencies]
hex.workspace = true
ignore.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs", "net"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true
