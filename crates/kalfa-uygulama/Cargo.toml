[package]
name = "kalfa-uygulama"
description = "Kalfa masaüstü uygulamasının Tauri'siz mantığı: oturum tablosu, köprü, şart penceresi akışı, kimlik deposu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
test-destek = ["kalfa-core/test-destek"]
# Uçtan uca testlerin sahte sağlayıcısı, sahte iletişim kutuları ve aktarım
# sayaçları (1c tasarımı §11.4). Sürüm derlemesine girmez.
e2e = ["dep:futures-util", "kalfa-sandbox/e2e", "kalfa-core/test-destek"]

[dependencies]
kalfa-mcp = { path = "../kalfa-mcp" }
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
kalfa-core = { path = "../kalfa-core" }
kalfa-evren = { path = "../kalfa-evren" }
kalfa-plugin = { path = "../kalfa-plugin" }
kalfa-sandbox = { path = "../kalfa-sandbox" }
kalfa-tools = { path = "../kalfa-tools" }
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
kalfa-uygulama = { path = ".", features = ["test-destek"] }
kalfa-core = { path = "../kalfa-core", features = ["test-destek"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
