[package]
name = "kalfa-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Gerçek yalıtımla MCP kabulü (`tests/yalitim.rs`, 1.1a-2 Görev 12). Yalıtım
# yoksa atlanmaz, başarısız olur.
yalitim-testleri = ["kalfa-sandbox/yalitim-testleri"]

[dependencies]
kalfa-core = { path = "../kalfa-core" }
kalfa-sandbox = { path = "../kalfa-sandbox" }
sha2.workspace = true
same-file.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["io-util"] }
url.workspace = true
bytes.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rustls.workspace = true

[dev-dependencies]
tempfile.workspace = true
base64.workspace = true
rmcp = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["process"] }
